name: Publish Spirit Apocalypse
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check game continuity
        run: node tests/engine.cjs
      - name: Check independent campaigns
        run: node tests/campaign.cjs
      - name: Check episode intro timing and history
        run: node tests/intro.cjs
      - name: Check relationships and selected base presentation
        run: node tests/view.cjs
      - name: Prepare version and offline assets
        run: python3 scripts/prepare-release.py --dist
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
